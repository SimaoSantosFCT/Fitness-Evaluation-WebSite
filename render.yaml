services:
  # ── Aplicação Web ────────────────────────────────────────────────────────────
  - type: web
    name: magda-fitness
    runtime: docker
    # O Render faz build do frontend + backend num só passo usando o render-build.sh
    buildCommand: "./render-build.sh"
    startCommand: "java -jar backend/target/fitness-api.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: magda-fitness-db
          property: connectionString
    plan: free

# ── Base de Dados PostgreSQL gratuita ────────────────────────────────────────
databases:
  - name: magda-fitness-db
    plan: free
    databaseName: magda_fitness
