services:
  - type: web
    name: magda-fitness
    runtime: docker
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: magda-fitness-db
          property: connectionString
    plan: free

databases:
  - name: magda-fitness-db
    plan: free
    databaseName: magda_fitness
